{% extends "users/base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="card">
    <h1>Регистрация</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Создать аккаунт</button>
    </form>
    <p>Уже есть аккаунт? <a href="{% url 'users:login' %}">Войти</a></p>
</div>
{% endblock %}
