<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Shop{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
        nav { background: #fff; padding: 14px 24px; display: flex; gap: 16px;
              align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
        nav .brand { font-weight: 700; font-size: 20px; margin-right: auto; }
        nav a { text-decoration: none; color: #2563eb; }
        main { max-width: 420px; margin: 40px auto; padding: 0 16px; }
        .card { background: #fff; padding: 28px; border-radius: 12px;
                box-shadow: 0 2px 10px rgba(0,0,0,.06); }
        .card h1 { margin-top: 0; font-size: 24px; }
        .card p { margin: 14px 0; }
        .card label { display: block; margin-bottom: 4px; font-size: 14px; }
        .card input { width: 100%; padding: 9px 10px; box-sizing: border-box;
                      border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        .helptext { font-size: 12px; color: #777; }
        .errorlist { color: #c0392b; list-style: none; padding: 0; margin: 4px 0; font-size: 13px; }
        button, .btn { background: #2563eb; color: #fff; border: 0; padding: 10px 18px;
                       border-radius: 8px; font-size: 15px; cursor: pointer; }
        .link-btn { background: none; color: #2563eb; padding: 0; }
    </style>
</head>
<body>
<nav>
    <span class="brand">Shop</span>
    {% if user.is_authenticated %}
        <a href="{% url 'users:profile' %}">{{ user.username }}</a>
        <form method="post" action="{% url 'users:logout' %}">
            {% csrf_token %}
            <button type="submit" class="link-btn">Выйти</button>
        </form>
    {% else %}
        <a href="{% url 'users:login' %}">Войти</a>
        <a href="{% url 'users:register' %}">Регистрация</a>
    {% endif %}
</nav>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
